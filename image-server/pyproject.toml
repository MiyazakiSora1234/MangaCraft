[project]
name = "mangacraft-image-server"
version = "1.0.0"
description = "MangaCraft 用のローカル画像生成サーバ（Diffusers）"
requires-python = ">=3.10,<3.14"
dependencies = [
  "torch>=2.7",
  "diffusers>=0.32",
  "transformers>=4.45",
  "accelerate>=1.0",
  "safetensors",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pillow",
]

# RTX 50 シリーズ（Blackwell）でも動くよう CUDA 12.8 版の PyTorch を使う
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
package = false
